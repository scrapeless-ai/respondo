name: Respondo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/run_tests.py

  distribution:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install hash-locked release tools
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Full-suite coverage
        run: |
          python -m coverage run scripts/run_tests.py
          python -m coverage combine
          python -m coverage report
      - name: Build and inspect source distribution and wheel
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
          python scripts/verify_dist.py dist --version 0.6.0 > dist/SHA256SUMS
      - name: Verify clean installation outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/respondo-smoke"
          "$RUNNER_TEMP/respondo-smoke/bin/python" -m pip install --no-index --no-deps "$GITHUB_WORKSPACE/dist/respondo-0.6.0-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/respondo-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" 0.6.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: respondo-0.6.0-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
